<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ponytail: token values are a hand-copied snapshot of this repo's
   ../diagram-design/references/style-guide.md default light skin, so a
   paper's page matches its own inline SVG figures. Re-sync by hand if that
   file's tokens change — no automated link between the two. */
:root {
  --paper: #f5f5f5;
  --ink: #2d3142;
  --muted: #4f5d75;
  --soft: #7a8399;
  --rule: rgba(45,49,66,0.12);
  --accent: #eb6c36;
  --link: #2e5aa8;
}
* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Geist', sans-serif;
  font-size: 16px;
  line-height: 1.65;
  max-width: 1100px;
  margin: 0 auto;
  padding: 56px 24px 96px;
  transition: max-width 0.2s ease;
}
body.wide { max-width: 1600px; }
.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
h1 {
  font-family: 'Times New Roman', Times, serif;
  font-weight: 700;
  font-size: 2.75rem;
  letter-spacing: 0.01em;
  line-height: 1.15;
  margin: 0 0 0.5em;
}
#width-toggle {
  flex: 0 0 auto;
  font-family: 'Geist Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
}
#width-toggle:hover { color: var(--ink); border-color: var(--ink); }
@media print { #width-toggle { display: none; } }
h2 {
  font-family: 'Times New Roman', Times, serif;
  font-weight: 700;
  font-size: 1.6rem;
  border-bottom: 1px solid var(--rule);
  padding-bottom: 6px;
  margin-top: 2.75em;
}
h3 {
  font-family: 'Times New Roman', Times, serif;
  font-weight: 700;
  font-size: 1.15rem;
  letter-spacing: 0.01em;
  margin-top: 1.75em;
}
p { margin: 1em 0; }
ul { margin: 1em 0; padding-left: 1.5em; }
li { margin: 0.35em 0; }
.abstract {
  font-style: italic;
  color: var(--muted);
  border-left: 2px solid var(--accent);
  padding-left: 18px;
  margin: 1.5em 0 2.5em;
}
.abstract-label {
  font-family: 'Geist Mono', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--soft);
  font-style: normal;
  display: block;
  margin-bottom: 0.5em;
}
/* display:table makes the <figure> box shrink-to-fit its inlined <svg>
   (never wider, never narrower), so the caption below — a table-caption —
   is forced to that same width and wraps instead of stretching past it or
   the diagram shrinking to match a long caption. Diagrams are inlined
   directly (build_paper.py extracts <svg>...</svg> from the source file),
   not referenced via <img src>, so there's no separate-file replaced-
   element sizing quirk to work around. */
figure {
  display: table;
  margin: 2em auto;
  max-width: 100%;
}
figure svg {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 0 auto;
}
figcaption {
  display: table-caption;
  caption-side: bottom;
  font-family: 'Geist Mono', monospace;
  font-size: 0.8rem;
  color: var(--soft);
  margin-top: 10px;
  text-align: left;
  overflow-wrap: break-word;
}
/* A "table" diagram is data, not an image — the shrink-to-fit trick above
   doesn't apply; the <table> already sets its own width (100%, capped by
   the page), so its figcaption just needs to be a normal block to match. */
figure.table-figure {
  display: block;
}
figure.table-figure figcaption {
  display: block;
}
figure.table-figure table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}
figure.table-figure th, figure.table-figure td {
  border-bottom: 1px solid var(--rule);
  padding: 6px 10px;
  text-align: left;
}
figure.table-figure thead th {
  font-family: 'Geist Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--soft);
  border-bottom: 1px solid var(--rule-solid, var(--rule));
}
a { color: var(--link); }
</style>
</head>
<body>
<div class="title-row">
<h1>{{TITLE}}</h1>
<button id="width-toggle" type="button" aria-pressed="false">Widen</button>
</div>
<div class="abstract"><span class="abstract-label">Abstract</span>{{ABSTRACT}}</div>
{{BODY}}
<script>
(function () {
  var btn = document.getElementById('width-toggle');
  btn.addEventListener('click', function () {
    var wide = document.body.classList.toggle('wide');
    btn.textContent = wide ? 'Narrow' : 'Widen';
    btn.setAttribute('aria-pressed', String(wide));
  });
})();
</script>
</body>
</html>
