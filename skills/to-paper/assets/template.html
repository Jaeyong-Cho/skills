<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ponytail: token values are a hand-copied snapshot of this repo's
   ../diagram-design/references/style-guide.md default light skin, so a
   paper's page matches its own inline SVG figures. Re-sync by hand if that
   file's tokens change — no automated link between the two. */
:root {
  --paper: #f5f5f5;
  --ink: #2d3142;
  --muted: #4f5d75;
  --soft: #7a8399;
  --rule: rgba(45,49,66,0.12);
  --accent: #eb6c36;
  --link: #2e5aa8;
}
* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Geist', sans-serif;
  font-size: 16px;
  line-height: 1.65;
  max-width: 960px;
  margin: 0 auto;
  padding: 56px 24px 96px;
  transition: max-width 0.2s ease;
}
body.wide { max-width: 1400px; }
#width-toggle {
  position: fixed;
  top: 16px;
  right: 16px;
  font-family: 'Geist Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
}
#width-toggle:hover { color: var(--ink); border-color: var(--ink); }
@media print { #width-toggle { display: none; } }
h1 {
  font-family: 'Instrument Serif', serif;
  font-weight: 400;
  font-size: 2.5rem;
  line-height: 1.15;
  margin-bottom: 0.5em;
}
h2 {
  font-family: 'Instrument Serif', serif;
  font-weight: 400;
  font-size: 1.6rem;
  border-bottom: 1px solid var(--rule);
  padding-bottom: 6px;
  margin-top: 2.75em;
}
h3 {
  font-family: 'Geist', sans-serif;
  font-weight: 600;
  font-size: 1.1rem;
  margin-top: 1.75em;
}
p { margin: 1em 0; }
.abstract {
  font-style: italic;
  color: var(--muted);
  border-left: 2px solid var(--accent);
  padding-left: 18px;
  margin: 1.5em 0 2.5em;
}
.abstract-label {
  font-family: 'Geist Mono', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--soft);
  font-style: normal;
  display: block;
  margin-bottom: 0.5em;
}
figure {
  margin: 2em 0;
  text-align: center;
}
figure img, figure svg {
  max-width: 100%;
  height: auto;
}
figcaption {
  font-family: 'Geist Mono', monospace;
  font-size: 0.8rem;
  color: var(--soft);
  margin-top: 10px;
}
a { color: var(--link); }
</style>
</head>
<body>
<button id="width-toggle" type="button" aria-pressed="false">Widen</button>
<h1>{{TITLE}}</h1>
<div class="abstract"><span class="abstract-label">Abstract</span>{{ABSTRACT}}</div>
{{BODY}}
<script>
(function () {
  var btn = document.getElementById('width-toggle');
  btn.addEventListener('click', function () {
    var wide = document.body.classList.toggle('wide');
    btn.textContent = wide ? 'Narrow' : 'Widen';
    btn.setAttribute('aria-pressed', String(wide));
  });
})();
</script>
</body>
</html>
